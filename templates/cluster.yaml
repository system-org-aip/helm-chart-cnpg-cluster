apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
spec:
  instances: {{ .Values.cluster.instances }}
  
  storage:
    {{- if .Values.cluster.storageClass }}
    storageClass: {{ .Values.cluster.storageClass }}
    {{- end }}
    size: {{ .Values.cluster.storageSize }}

  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.backup.enabled }}
  {{- if eq (.Values.backup.method | default "plugin") "plugin" }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "cnpg-cluster.backup.objectStoreName" . }}
        {{- if .Values.backup.serverName }}
        serverName: {{ .Values.backup.serverName }}
        {{- end }}
  {{- else }}
  backup:
    {{- if .Values.backup.retentionPolicy }}
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
    {{- end }}
    barmanObjectStore:
      {{- include "cnpg-cluster.backup.barmanConfiguration" . | nindent 6 }}
      {{- if .Values.backup.serverName }}
      serverName: {{ .Values.backup.serverName }}
      {{- end }}
  {{- end }}
  {{- end }}

  managed:
    roles:
      {{- range .Values.users }}
      - name: {{ .name }}
        ensure: {{ .ensure | default "present" }}
        login: true
        superuser: {{ .superuser | default false }}
        inherit: true
        connectionLimit: {{ .connectionLimit | default 20 }}
        passwordSecret:
          name: pguser-{{ .name }}
        {{- if .inRoles }}
        inRoles:
          {{- toYaml .inRoles | nindent 10 }}
        {{- end }}
      {{- end }}

  # Conditional Bootstrap section
  {{- if .Values.cluster.bootstrap.enabled }}
  bootstrap:
    initdb:
      {{- with .Values.cluster.bootstrap.initdb }}
      database: {{ .database | quote }}
      owner: {{ .owner | quote }}
      {{- if .secret }}
      # Optional: if you want to use a specific secret for the app user
      secret:
        name: {{ .secret }}
      {{- end }}
      {{- end }}
  {{- end }}
